name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v3
        with:
          sqlc-version: "1.30.0"

      - name: SQLC generate
        run: sqlc generate

      - name: SQLC verify generated code is clean
        run: git diff --exit-code internal/repository/db

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

      - name: Install Typst
        run: |
          set -e
          curl -L https://github.com/typst/typst/releases/download/v0.11.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-*/typst /usr/local/bin/typst

      - name: Typst compile
        run: typst compile templates/ticket.typ /tmp/ticket.pdf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Client build
        run: cd client && npm ci && npm run build

  # Image build and deploy run only when triggered by hand from the Actions tab,
  # so pushes and pull requests never publish images or touch the server.
  build-api:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-api
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: PROD
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOSTS: ${{ vars.VPS_HOSTS }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOSTS" ]; then
            echo "Missing VPS_SSH_KEY or VPS_HOSTS secrets."
            exit 1
          fi
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "Missing REGISTRY_USERNAME or REGISTRY_TOKEN secrets."
            exit 1
          fi

          SSH_USER="${SSH_USER:-deploy}"
          API_IMAGE_TAG="${{ env.API_IMAGE }}:latest"

          echo "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          for host in ${VPS_HOSTS//,/ }; do
            ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$host" \
              "cd /opt/siteproof && git pull --ff-only && printf '%s' \"$REGISTRY_TOKEN\" | docker login $REGISTRY -u \"$REGISTRY_USERNAME\" --password-stdin && API_IMAGE=$API_IMAGE_TAG docker compose -f docker-compose.prod.yml pull && API_IMAGE=$API_IMAGE_TAG docker compose -f docker-compose.prod.yml up -d"
          done
